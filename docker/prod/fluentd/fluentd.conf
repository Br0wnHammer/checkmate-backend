<source>
  @type forward
  port 24224
</source>

<filter docker.**>
  @type record_transformer
  enable_ruby true
  <record>
    service_name ${record["service_name"] rescue "unknown-service"}
    environment ${record["environment"] rescue "unknown-env"}
    container_id ${record["container_id"] rescue "unknown-container"}
    container_name ${record["container_name"] rescue "unknown-container"}
    host_name ${record["host_name"] rescue "unknown-host"}
    log ${record["log"]}
    timestamp ${Time.now.utc.iso8601}
  </record>
</filter>

<match docker.**>
  @type forward
  send_timeout 60s
  recover_wait 10s
  hard_timeout 60s

  <server>
    name signoz
    host uptime.signoz.uprock.com
    port 24224
  </server>

  <buffer>
    @type memory
    flush_interval 5s
  </buffer>
</match>