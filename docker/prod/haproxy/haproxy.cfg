global
	maxconn 8192
	log /dev/log	local0
	log /dev/log	local1 notice
	chroot /var/lib/haproxy
    stats socket ipv4@127.0.0.1:9000 level admin
	stats timeout 30s
	user haproxy
	group haproxy
	daemon

	# Default SSL material locations
	ca-base /etc/ssl/certs
	crt-base /etc/ssl/private

	# See: https://ssl-config.mozilla.org/#server=haproxy&server-version=2.0.3&config=intermediate
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
	log	global
	mode	http
	option	httplog
	option	dontlognull
    timeout connect 2s
    timeout client  1m
    timeout server  5s
	errorfile 400 /etc/haproxy/errors/400.http
	errorfile 403 /etc/haproxy/errors/403.http
	errorfile 408 /etc/haproxy/errors/408.http
	errorfile 500 /etc/haproxy/errors/500.http
	errorfile 502 /etc/haproxy/errors/502.http
	errorfile 503 /etc/haproxy/errors/503.http
	errorfile 504 /etc/haproxy/errors/504.http

resolvers local
    nameserver ns1 127.0.0.53:53
    nameserver ns2 192.168.1.1:53
    hold valid 5s
    resolve_retries 3
    timeout retry 1s
    timeout resolve 1s

frontend igw
    bind 127.0.0.1:8785
    mode http
    stats enable
    monitor-uri /api/health
    # stats uri /admin
    # stats auth admin:admin
    # stats refresh 5s
	default_backend DEFAULT
    option forwardfor
	use_backend %[str(active),map(/home/ubuntu/haproxy-hosts.map)]

backend blue
    mode http
    option http-keep-alive
    timeout http-keep-alive 10m
    timeout connect 10s
    balance roundrobin
    option httpchk GET /
    option redispatch
    retries 1000
    retry-on all-retryable-errors
    # http-check send meth GET  uri /
    http-check expect status 404
    server blue 127.0.0.1:4000 maxconn 10 check inter 2s  fall 2  rise 2 slowstart 5000 resolvers local init-addr none

backend green
    mode http
    option http-keep-alive
    timeout http-keep-alive 10m
    timeout connect 10s
    balance roundrobin
    option httpchk GET / 
    option redispatch
    retries 1000
    retry-on all-retryable-errors
    #http-check send meth GET  uri /
	http-check expect status 404
    server green 127.0.0.1:5000 maxconn 10 check inter 2s  fall 2  rise 2 slowstart 5000 resolvers local init-addr none

backend DEFAULT
    http-request set-log-level silent
    http-request return status 404 content-type "text/html" string "Default backend"
