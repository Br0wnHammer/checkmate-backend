on:
  push:
    # branches:
    #   - main

permissions:
  packages: write
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
        
      - name: Docker Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GH_UPTIME_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      - name: Docker Build and Push
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          sed -i '/"dependencies": {/a \    "aws4": "^1.13.2",' package.json
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/uptime:${COMMIT_HASH}
          docker build -t $IMAGE_NAME . -f docker/prod/ci.Dockerfile
          docker push $IMAGE_NAME

