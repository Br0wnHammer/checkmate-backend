      - name: Configure Nginx and HAProxy
        uses: ./.github/actions/configure
        with:
          REMOTE_USER: "ubuntu"
          SERVER_IP: "${{ secrets.UPTIME_1_HOST_IP }}"
          DOMAIN: "uptime.uprock.com"
       
