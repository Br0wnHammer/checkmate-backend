name: Production Deploy

on:
  push:
    branches:
      - main

permissions:
  packages: write
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          driver: docker-container  # Ensures Buildx works with caching

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_UPTIME_PAT }}

      - name: Fix package.json
        run: |
          sed -i '/"dependencies": {/a \    "aws4": "^1.13.2",' package.json
        
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/prod/ci.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }},ghcr.io/${{ github.repository }}:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:cache,mode=max

  setup-uptime-1:
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Update AWS Security Groups & Setup SSH Key
        uses: ./.github/actions/setup
        with:
          AWS_ACCESS_KEY_ID: "${{ secrets.AWS_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY: "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          REGIONS: "${{ secrets.UPTIME_1_AWS_REGION }}"
          SECURITY_GROUPS: "${{ secrets.UPTIME_1_SECURITY_GROUP }}"

      - name: Setup SSH Key for GitHub
        env:
          SSH_KEY: ${{ secrets.UPTIME_1_SSH_KEY }}
        shell: bash
        run: |
          mkdir -p ~/.ssh || true
          echo "${SSH_KEY}" > ~/.ssh/id_rsa_uptime
          chmod 600 ~/.ssh/id_rsa_uptime
          ssh-keygen -l -f ~/.ssh/id_rsa_uptime

      - name: Install Required Packages on Remote Server
        uses: ./.github/actions/install
        with:
          REMOTE_USER: "ubuntu"
          SERVER_IP: "${{ secrets.UPTIME_1_HOST_IP }}"
          
