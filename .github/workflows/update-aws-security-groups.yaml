name: Update AWS Security Groups for Multiple Regions

on:
  schedule:
    - cron: '0 * * * *'  # Runs every hour
  workflow_dispatch:  # Allow manual execution

jobs:
  update-sg:
    runs-on: ubuntu-latest

    steps:
      - name: Get Public IP of GitHub Actions Runner
        id: get_public_ip
        run: |
          # Fetch the public IP using an external service
          IP=$(curl -s http://ifconfig.me)
          echo "Public IP is $IP"
          echo "IP=$IP" >> $GITHUB_ENV

      - name: Configure AWS CLI
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set region us-east-1  # Default region for setup

      - name: Update AWS Security Groups in Multiple Regions
        env:
          REGIONS: "eu-west-1"
          SECURITY_GROUPS: "sg-0fcd48c1b8cd4b692"
        run: |
          IFS=' ' read -r -a REGION_ARRAY <<< "$REGIONS"
          IFS=' ' read -r -a SG_ARRAY <<< "$SECURITY_GROUPS"

          for i in "${!REGION_ARRAY[@]}"; do
            REGION=${REGION_ARRAY[$i]}
            SG_ID=${SG_ARRAY[$i]}
            echo "Updating Security Group $SG_ID in $REGION"

            # Set AWS Region
            aws configure set region $REGION

            # Remove old rules
            EXISTING_IPS=$(aws ec2 describe-security-groups --group-id $SG_ID --query "SecurityGroups[0].IpPermissions[?ToPort==\`22\`].IpRanges[*].CidrIp" --output text)
            for OLD_IP in $EXISTING_IPS; do
              aws ec2 revoke-security-group-ingress --group-id $SG_ID --protocol tcp --port 22 --cidr $OLD_IP || true
            done

            # Add new GitHub Actions IPs
            echo "Updating security group for $IP..."
            aws ec2 authorize-security-group-ingress --group-id $SG_ID --protocol tcp --port 22 --cidr $IP || true
          done
