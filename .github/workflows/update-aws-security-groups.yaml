name: Update AWS Security Groups for Multiple Regions

on:
  schedule:
    - cron: '0 * * * *'  # Runs every hour
  workflow_dispatch:  # Allow manual execution

jobs:
  update-sg:
    runs-on: ubuntu-latest

    steps:
      - name: Get GitHub Actions Runner IPs
        id: get_ips
        run: |
          IPS=$(curl -s https://api.github.com/meta | jq -r '.actions | join(" ")')
          echo "IPS=${IPS}" >> $GITHUB_ENV

      - name: Configure AWS CLI
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set region us-east-1  # Default region for setup

      - name: Get GitHub Actions Runner IPs and Merge CIDR Block
        id: merge_cidr
        run: |
            # Fetch GitHub Actions runner IPs
            IPS=$(curl -s https://api.github.com/meta | jq -r '.actions[]')
            
            # Save IPs to a temporary file
            echo "$IPS" > github_ips.txt
            
            # Install Python and ipaddress module (if not already installed)
            sudo apt-get update
            sudo apt-get install -y python3 python3-pip
            pip3 install ipaddress

            # Python script to merge IPs into a CIDR block
            python3 <<EOF
            import ipaddress

            # Read the IPs from the file
            with open('github_ips.txt') as f:
                ips = [line.strip() for line in f.readlines()]

            # Convert IPs to network objects
            networks = [ipaddress.IPv4Network(f"{ip}/32", strict=False) for ip in ips]

            # Aggregate networks
            aggregated_network = networks[0]
            for network in networks[1:]:
                aggregated_network = aggregated_network.supernet_of(network) if aggregated_network.supernet_of(network) else aggregated_network

            # Output the smallest CIDR block
            print(f"CIDR block that covers all IPs: {aggregated_network}")
            EOF
