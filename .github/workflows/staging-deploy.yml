name: Staging Deploy

on:
    push:
        # branches:
        #     - develop

jobs:
    deploy:
        runs-on: self-hosted

        steps:
        - name: Checkout code
          uses: actions/checkout@v2

        - name: Docker build
          uses: hoverkraft-tech/compose-action@v2.0.1
          with:
            compose-file: ./docker/prod/docker-compose.staging.yml