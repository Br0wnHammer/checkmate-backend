name: Staging Deploy

on:
  push:
    # branches:
    #   - develop

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      - name: Docker Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GH_UPTIME_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      - name: Docker Build and Push
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          sed -i '/"dependencies": {/a \    "aws4": "^1.13.2",' package.json
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/uptime:${COMMIT_HASH}
          docker build -t $IMAGE_NAME . -f docker/prod/ci.Dockerfile
          docker push $IMAGE_NAME

  setup-uptime:
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Update AWS Security Groups & Setup SSH Key
        uses: ./.github/actions/setup
        with:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          REGIONS: "${{ secrets.UPTIME_STAGING_AWS_REGION }}"
          SECURITY_GROUPS: "${{ secrets.UPTIME_STAGING_SECURITY_GROUP }}"

      - name: Setup SSH Key for GitHub
        env:
          SSH_KEY: ${{ secrets.UPTIME_STAGING_SSH_KEY }}
        shell: bash
        run: |
          mkdir -p ~/.ssh || true
          echo "${SSH_KEY}" > ~/.ssh/id_rsa_uptime
          chmod 600 ~/.ssh/id_rsa_uptime
          ssh-keygen -l -f ~/.ssh/id_rsa_uptime

      - name: Install Required Packages on Remote Server
        uses: ./.github/actions/install
        with:
          REMOTE_USER: "ubuntu"
          SERVER_IP: "${{ secrets.UPTIME_STAGING_HOST_IP }}"
          
