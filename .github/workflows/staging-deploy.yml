name: Staging Deploy

on:
    push:
        # branches:
        #     - develop

jobs:
    deploy:
        runs-on: self-hosted

        steps:
        - name: 'Cleanup build folder'
          run: |
            rm -rf ./${{github.workspace}}\*        
        
        - name: Checkout code
          uses: actions/checkout@v2

        - name: Build Docker image
          run: |
            sed -i 's/\.\/Server/./g' docker/prod/server.Dockerfile
            docker build -t uptime-backend:develop -f docker/prod/server.Dockerfile .
