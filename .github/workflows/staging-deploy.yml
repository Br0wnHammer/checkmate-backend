name: Staging deploy

on:
  push:
    branches: ["develop"]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name as environment variable
        run: echo "IMAGE_NAME=ghcr.io/bluewave-labs/checkmate-backend:staging" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE_NAME \
            -f ./docker/test/server.Dockerfile \
            --label org.opencontainers.image.source=https://github.com/bluewave-labs/checkmate-backend \
            .

      - name: Push Docker image to GHCR
        run: docker push $IMAGE_NAME
      - name: SSH into server and restart container using Docker Compose
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_SERVER_HOST }} # IP address or domain of your server
          username: ${{ secrets.STAGING_SERVER_USER }} # Username to SSH into the server
          key: ${{ secrets.STAGING_SERVER_SSH_KEY }} # The private key stored in secrets
          script: |
            cd /checkmate/server/docker/staging
            docker-compose down                   # Stop and remove containers
            docker-compose pull                   # Pull the latest images
            docker-compose up -d                  # Restart containers with the latest images
