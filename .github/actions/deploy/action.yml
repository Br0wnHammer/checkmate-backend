name: docker start
description: 'Start Backend Service on remote server'
inputs:
  REMOTE_USER:
    description: 'Remote Server User'
    required: true
  SERVER_IP:
    description: 'Remote Server IP'
    required: true
  MONGODB_URL:
    description: 'MongoDB Connection String'
    required: true
  REDIS_URL:
    description: 'Redis URL'
    required: true
  REPOSITORY_OWNER:
    description: 'Repository Owner'
    required: true
  DOCKER_SECRET:
    description: 'Docker Secret'
    required: true
  CALLBACK_URL:
    description: 'Call back url'
    required: true
  UPROCK_API_KEY:
    description: 'Uprock API Key'
    required: true
  ENVIRONMENT:
    description: 'Environment'
    required: true
  REPOSITORY:
    description: 'Repository'
    required: true
  IMAGE_TAG:
    description: 'Image Tag'
    required: true
  SIGNOZ_LOG_ENDPOINT:
    description: 'Signoz Log Endpoint'
    required: true
    default: 'http://52.209.145.102:2254'
  REGION:
    description: 'Region'
    required: true
    default: 'eu-west-1'
  OTEL_EXPORTER_OTLP_SPAN_ENDPOINT:
    description: 'OpenTelemetry Collector Span Endpoint'
    required: true
    default: 'http://uptime.signoz.uprock.com:4318/v1/traces'
runs: 
  using: 'composite'
  steps:
    - name: Start Backend Service
      shell: bash
      run: |
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa_uptime ${{ inputs.REMOTE_USER }}@${{ inputs.SERVER_IP }} << 'EOF'
          echo "${{ inputs.DOCKER_SECRET }}" | docker login ghcr.io -u ${{ inputs.REPOSITORY_OWNER }} --password-stdin

          set -o xtrace

          cd ~/uptime-backend
          IMAGE_NAME=ghcr.io/${{ inputs.REPOSITORY }}:${{ inputs.IMAGE_TAG }}

          CURRENT_LIVE=$(echo "show map /home/ubuntu/haproxy-hosts.map" | socat stdio tcp4-connect:127.0.0.1:9000 | grep active | awk "{print \$3}")

          if [ "${CURRENT_LIVE}" == "green" ]; then
            NEXT_LIVE="blue"
            NEXT_PORT=4000
          else
            NEXT_LIVE="green"
            NEXT_PORT=5000
          fi
          
          docker stop uptime-backend-${NEXT_LIVE} || true
          docker rm uptime-backend-${NEXT_LIVE} || true

          docker ps -q --filter "status=running" --filter "publish=${NEXT_PORT}" | xargs -r docker stop || true
          docker rm `docker ps -a -q --filter "status=exited" --filter "publish=${NEXT_PORT}"` || true

          docker run -d \
            --name uptime-backend-${NEXT_LIVE} \
            -p 127.0.0.1:${NEXT_PORT}:5000 \
            --restart always \
            --log-driver=fluentd \
            --log-opt fluentd-address=localhost:24224 \
            --log-opt tag="docker.{{.Name}}" \
            --log-opt labels=service_name,environment,host_name,region \
            --label service_name=uptime-backend-${NEXT_LIVE} \
            --label environment=${{ inputs.ENVIRONMENT }} \
            --label region=${{ inputs.REGION }} \
            --label host_name=`hostname` \
            -e DB_CONNECTION_STRING="${{ inputs.MONGODB_URL }}" \
            -e REDIS_URL="${{ inputs.REDIS_URL }}" \
            -e CALLBACK_URL="${{ inputs.CALLBACK_URL }}" \
            -e UPROCK_API_KEY="${{ inputs.UPROCK_API_KEY }}" \
            -e OTEL_EXPORTER_OTLP_SPAN_ENDPOINT="${{ inputs.OTEL_EXPORTER_OTLP_SPAN_ENDPOINT }}" \
            -e SERVICE_NAME=uptime-backend-${NEXT_LIVE} \
            -e ENVIRONMENT=${{ inputs.ENVIRONMENT }} \
            -e HOST_NAME=`hostname` \
            ${IMAGE_NAME}
            
          STATUS=$(echo "show stat" | socat stdio tcp4-connect:127.0.0.1:9000 | cut -d "," -f 2,18 | column -s, -t | grep ${NEXT_LIVE} | uniq | awk "{print \$2}")
          for i in {1..60}; do
            if [ "$STATUS" == "UP" ]; then
              echo "set map /home/ubuntu/haproxy-hosts.map active ${NEXT_LIVE}" | socat stdio tcp4-connect:127.0.0.1:9000
              break
            fi
            sleep 1
            STATUS=$(echo "show stat" | socat stdio tcp4-connect:127.0.0.1:9000 | cut -d "," -f 2,18 | column -s, -t | grep ${NEXT_LIVE} | uniq | awk "{print \$2}")
          done

          if [ "$STATUS" != "UP" ]; then
            echo "Service did not start within 1 minute"
            exit 1
          fi

          docker system prune --all --force
        EOF
